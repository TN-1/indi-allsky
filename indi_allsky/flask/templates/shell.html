{% extends "base.html" %}

{% block head %}
<script>
    var camera_id = {{ camera_id }};
</script>
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('indi_allsky.static', filename='css/xterm.css') }}" />
<script src="{{ url_for('indi_allsky.static', filename='js/xterm.js') }}"></script>
<script src="{{ url_for('indi_allsky.static', filename='js/xterm-addon-fit.js') }}"></script>

<style>
    /* Ensure the terminal card and container expand to fill available vertical space */
    #terminal-card {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 60px); /* Adjust 60px based on nav/header height if needed */
        margin-bottom: 0;
    }
    #terminal-card .card-body {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    #terminal {
        flex-grow: 1;
        width: 100%;
        height: 100%;
    }
    /* Hide scrollbars on the main page to keep the terminal focused */
    body {
        overflow: hidden;
    }
</style>

<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col">
            <div id="terminal-card" class="card bg-dark text-white rounded-0 border-0">
                <div class="card-body p-1">
                    <div id="terminal"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const term = new Terminal({
            cursorBlink: true,
            theme: {
                background: '#212529', // Match bootstrap dark card
            }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        
        term.open(document.getElementById('terminal'));
        
        // Construct WebSocket URL
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = protocol + '//' + window.location.host + "{{ url_for('indi_allsky.shell_ws_view') }}";
        
        console.log("Connecting to WebSocket:", wsUrl);
        const socket = new WebSocket(wsUrl);

        socket.onmessage = function (event) {
            term.write(event.data);
        };

        socket.onopen = () => {
            console.log("PTY: Connected via WebSocket");
            term.write("\r\n\x1b[32mConnected to server.\x1b[0m\r\n");
            setTimeout(() => {
                fitToscreen();
            }, 300);
        };

        socket.onclose = (event) => {
            console.log("PTY: Disconnected:", event.reason);
            term.write("\r\n\x1b[31mDisconnected from server.\x1b[0m\r\n");
        };

        socket.onerror = (error) => {
            console.log("PTY: WebSocket Error:", error);
            term.write("\r\n\x1b[33mWebSocket connection failed.\x1b[0m\r\n");
        };

        term.onData((data) => {
            socket.send(data);
        });

        function fitToscreen() {
            fitAddon.fit();
            const dims = { type: 'resize', cols: term.cols, rows: term.rows };
            console.log("sending new dimensions to server's pty", dims);
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(dims));
            }
        }

        function debounce(func, wait_ms) {
            let timeout;
            return function (...args) {
                const context = this;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), wait_ms);
            };
        }

        const wait_ms = 50;
        window.onresize = debounce(fitToscreen, wait_ms);

        // Initial fit
        setTimeout(fitToscreen, 50);
    });
</script>
{% endblock %}
