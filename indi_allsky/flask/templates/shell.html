{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('indi_allsky.static', filename='css/xterm.css') }}" />
<script src="{{ url_for('indi_allsky.static', filename='js/xterm.js') }}"></script>
<script src="{{ url_for('indi_allsky.static', filename='js/xterm-addon-fit.js') }}"></script>

<style>
    /* Ensure the terminal card and container expand to fill available vertical space */
    #terminal-card {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 60px); /* Adjust 60px based on nav/header height if needed */
        margin-bottom: 0;
    }
    #terminal-card .card-body {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    #terminal {
        flex-grow: 1;
        width: 100%;
        height: 100%;
    }
    /* Hide scrollbars on the main page to keep the terminal focused */
    body {
        overflow: hidden;
    }
</style>

<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col">
            <div id="terminal-card" class="card bg-dark text-white rounded-0 border-0">
                <div class="card-body p-1">
                    <div id="terminal"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const term = new Terminal({
        cursorBlink: true,
        theme: {
            background: '#212529', // Match bootstrap dark card
        }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    
    term.open(document.getElementById('terminal'));
    
    // Function to handle resizing correctly
    function resizeTerminal() {
        fitAddon.fit();
    }

    // Initial fit
    setTimeout(resizeTerminal, 10);

    term.writeln('                                               :::::::::::                                          ');
    term.writeln('                                          ::=+*#%%@@@@@%%#*+=::                                     ');
    term.writeln('                                      ::-+#@@@@@@%%#**#%@@@@@@#+-::                                 ');
    term.writeln('                                     -+#@@@@%#+-::::::::::=+#@@@@%+=:                               ');
    term.writeln('                                  ::-#@@@@+-:::=-::::*@@#-::::=#@@@#=::                             ');
    term.writeln('                                 ::*@@@%+:::::=@=:::-@##@#:=*-::-*@@@#-:                            ');
    term.writeln('                                :-%@@@+::--:::=@=:::+@-:+@-+@-::::-*@@%-:                           ');
    term.writeln('                               :-%@@%-::-@+:::=@=:::+@+:-+-*@:-%#-::+@@@-:                          ');
    term.writeln('                              :-%@@*:::::@+:::-@=:::-@@@*::*@=@@*-+::-%@%-:                         ');
    term.writeln('                             ::#@@#:-*-::@*:::-@+::::-*@@#:#@@%-::%+::-@@%::                        ');
    term.writeln('                             :=@@@-:#@#::%*:::-@+::::::-#@:%@%%:::+#-+:*@@+:                        ');
    term.writeln('                             :%@@%:-@=@+:%#:::-@+:::*@::+@:%#=@=::-@#@--@@%::                       ');
    term.writeln('                            :-@@@*:*@*@@:#%=**:@%%%*+@#+@#:@*:#%:::#%-::@@@=:                       ');
    term.writeln('                            :+@@@=-@+--@+*@@@@:@@@@#:%@@@-:@+:=@+::%*:::#@@+:                       ');
    term.writeln('                         ::-=#@@@+====================++================#@@%--::                    ');
    term.writeln('                      ::=#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*=:                  ');
    term.writeln('                     :-#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*:                 ');
    term.writeln('                    :-%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#:                ');
    term.writeln('                    :+@@@@@@@-::=@@@-:::=@@@@@@#::-@@@-::::::--=+#@@@@@@-::=@@@@@@@-:               ');
    term.writeln('                    :#@@@@@@@-::=@@@-::::-@@@@@#::-@@@-::-**++=-::-*@@@@-::=@@@@@@@+:               ');
    term.writeln('                    :*@@@@@@@-::=@@@-::+::-%@@@#::-@@@-::=@@@@@@#:::+@@@-::=@@@@@@@+:               ');
    term.writeln('                    :*@@@@@@@-::=@@@-::##-:-%@@#::-@@@-::=@@@@@@@*:::%@@-::=@@@@@@@+:               ');
    term.writeln('                    :*@@@@@@@-::=@@@-::#@%-:-%@#::-@@@-::=@@@@@@@%:::*@@-::=@@@@@@@+:               ');
    term.writeln('                    :*@@@@@@@-::=@@@-::#@@%-:-##::-@@@-::=@@@@@@@*:::#@@-::=@@@@@@@+:               ');
    term.writeln('                    :*@@@@@@@-::=@@@-::#@@@%-::+::-@@@-::=@@@@@@#-::=@@@-::=@@@@@@@+:               ');
    term.writeln('                    :+@@@@@@@-::=@@@-::#@@@@@-::::-@@@-::-***+=-:::=@@@@-::=@@@@@@@-:               ');
    term.writeln('                    :-@@@@@@@-::=@@@-::#@@@@@@-:::-@@@-:::::::::=*%@@@@@-::=@@@@@@%:                ');
    term.writeln('                     :=@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%-:                ');
    term.writeln('                      :-*@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%+::                 ');
    term.writeln('                        ::=++**********************###**********************++=::                   ');
    term.writeln('                            :::::::::::::::::::::::::::::::::::::::::::::::::                       ');
    term.writeln('Welcome to \x1b[1;32mindi-allsky\x1b[0m');
    term.writeln('\x1b[1;31mCAUTION:\x1b[0m You are in a live system shell. Exercise extreme caution.');
    term.writeln('INDEV: This is a visual preview of the terminal.');
    term.write('$ ');

    window.addEventListener('resize', resizeTerminal);
</script>
{% endblock %}
